[project]
name = "verdiclip"
version = "0.2.0"
description = "Fast, faithful screenshot capture and annotation for Windows."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "ATTRIBUTION.md"]
authors = [{ name = "Mike Hill", email = "mike@mikejhill.com" }]
requires-python = ">=3.13"
keywords = ["screenshot", "annotation", "screen-capture", "windows"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: Editors",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
]
dependencies = [
    "mss>=10.2.0",
    "pyside6-essentials>=6.11.2",
]

[project.urls]
Homepage = "https://github.com/mikejhill/verdiclip"
Documentation = "https://github.com/mikejhill/verdiclip#readme"
Changelog = "https://github.com/mikejhill/verdiclip/blob/main/CHANGELOG.md"
Issues = "https://github.com/mikejhill/verdiclip/issues"

[project.scripts]
verdiclip = "verdiclip.__main__:Application.main"

[project.gui-scripts]
verdiclip-gui = "verdiclip.__main__:Application.main"

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A", "ANN", "ARG", "B", "BLE", "C4", "C90", "D", "DTZ", "E", "ERA", "F",
    "FA", "FBT", "G", "I", "LOG", "N", "PERF", "PGH", "PIE", "PL", "PT", "PTH",
    "RET", "RSE", "RUF", "S", "SIM", "T20", "TID", "TRY", "UP", "W",
]
ignore = [
    "D107",    # __init__ docstring: the class docstring covers it
    "TRY003",  # long messages in raise: context-rich messages are required here
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.ruff.lint.pep8-naming]
# Qt virtual overrides must keep Qt's camelCase names.
extend-ignore-names = [
    "paintEvent", "mousePressEvent", "mouseMoveEvent", "mouseReleaseEvent",
    "mouseDoubleClickEvent", "keyPressEvent", "keyReleaseEvent", "wheelEvent",
    "resizeEvent", "closeEvent", "showEvent", "focusOutEvent", "dragEnterEvent",
    "dropEvent", "nativeEventFilter", "leaveEvent", "enterEvent", "sizeHint",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
docstring-code-format = true

[tool.ty.environment]
# A Windows-only app: type-check against Windows APIs on any host
python-platform = "win32"

[tool.ty.rules]
all = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra", "--import-mode=importlib"]
xfail_strict = true
qt_api = "pyside6"
markers = [
    "ux: user journey test proving a UX contract item",
    "ux_budget: journey test that enforces a latency budget",
]

[tool.coverage.run]
source = ["verdiclip"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.poe.tasks]
format = { cmd = "ruff format .", help = "Format code" }
format-check = { cmd = "ruff format --check .", help = "Check formatting" }
lint = { cmd = "ruff check .", help = "Lint code" }
lint-fix = { cmd = "ruff check . --fix", help = "Lint and auto-fix" }
typecheck = { cmd = "ty check", help = "Type check (strict)" }
test = { cmd = "pytest --cov", help = "Run tests with coverage" }
ux = { cmd = "pytest -m ux tests/ux", help = "Run UX journey tests only" }
ux-gallery = { cmd = "python scripts/ux_gallery.py", help = "Render key screens in light and dark themes into docs/ux/gallery for design review" }
ux-snapshots = { cmd = "pytest -m ux tests/ux --ux-snapshots=docs/ux/snapshots", help = "Run UX journeys and save a PNG per step for review" }
lint-workflows = { shell = "uvx --from actionlint-py actionlint && uvx zizmor --offline .github/workflows", help = "Lint GitHub Actions workflows (actionlint + zizmor)" }
fix = { sequence = ["format", "lint-fix"], help = "Auto-fix formatting and lint" }
check = { sequence = ["format-check", "lint", "typecheck", "test"], help = "Run every quality gate" }

[dependency-groups]
dev = [
    "poethepoet>=0.48.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-qt>=4.5.0",
    "ruff>=0.16.10",
    "ty>=0.0.85",
]
