<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="220" viewBox="0 0 1080 220" role="img" aria-labelledby="title desc"><title id="title">Capture, annotate, deliver</title><desc id="desc">Capture a region, window, or screen; annotate with arrows, labels, and highlights; deliver to clipboard, file, or print.</desc><rect width="1080" height="220" rx="20" fill="#eef5f0"/><g font-family="Segoe UI,Arial,sans-serif" fill="#173e34"><g transform="translate(30 30)"><rect width="310" height="160" rx="14" fill="#fff"/><text x="24" y="39" font-size="15" font-weight="700" fill="#087f64">01 / CAPTURE</text><text x="24" y="81" font-size="24" font-weight="600">Choose the moment.</text><text x="24" y="115" font-size="15">Region, window, or full screen.</text><text x="24" y="138" font-size="15">Faithful pixels. Precise edges.</text></g><g transform="translate(385 30)"><rect width="310" height="160" rx="14" fill="#fff"/><text x="24" y="39" font-size="15" font-weight="700" fill="#087f64">02 / ANNOTATE</text><text x="24" y="81" font-size="24" font-weight="600">Make the point.</text><text x="24" y="115" font-size="15">Arrows, labels, and highlights.</text><text x="24" y="138" font-size="15">Every edit stays undoable.</text></g><g transform="translate(740 30)"><rect width="310" height="160" rx="14" fill="#fff"/><text x="24" y="39" font-size="15" font-weight="700" fill="#087f64">03 / DELIVER</text><text x="24" y="81" font-size="24" font-weight="600">Put it to work.</text><text x="24" y="115" font-size="15">Copy, save, or print.</text><text x="24" y="138" font-size="15">Keep your flow moving.</text></g><path d="M348 110H375M368 103L375 110L368 117M703 110H732M725 103L732 110L725 117" fill="none" stroke="#087f64" stroke-width="3"/></g></svg>
