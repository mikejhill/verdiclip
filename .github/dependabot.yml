version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
    cooldown:
      default-days: 7

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      prefix-development: chore
    groups:
      runtime:
        dependency-type: production
      dev-tools:
        dependency-type: development
    cooldown:
      default-days: 7
