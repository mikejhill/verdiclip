# actionlint 1.7.12 predates GitHub's job-level cache-mode token restriction.
# https://github.com/rhysd/actionlint/issues/762
# Remove this exact compatibility exception when the pinned release supports it.
# tests/portable/test_hosted_workflow.py validates its value and matching scope.
paths:
  .github/workflows/ci.yml:
    ignore:
      - '^unexpected key "cache-mode" for "job" section\. expected one of "concurrency", "container", "continue-on-error", "defaults", "env", "environment", "if", "name", "needs", "outputs", "permissions", "runs-on", "secrets", "services", "snapshot", "steps", "strategy", "timeout-minutes", "uses", "with"$'
  .github/workflows/gui-readiness-profile.yml:
    ignore:
      - '^unexpected key "cache-mode" for "job" section\. expected one of "concurrency", "container", "continue-on-error", "defaults", "env", "environment", "if", "name", "needs", "outputs", "permissions", "runs-on", "secrets", "services", "snapshot", "steps", "strategy", "timeout-minutes", "uses", "with"$'
