name: Frozen menu native qualification

on:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    if: >-
      github.event.pull_request.head.repo.full_name == 'mikejhill/verdiclip' &&
      github.head_ref == 'feature/freeze-first-menu' &&
      github.event.pull_request.draft == true
    name: Frozen menu / ${{ matrix.source }} / Qt ${{ matrix.qt }}
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        qt: ["6.11.2", "6.12.0"]
        source: [candidate, released-0121, released-0131]
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: windows
      QUALIFICATION_HEAD: ${{ github.event.pull_request.head.sha }}
      QT_VERSION: ${{ matrix.qt }}
      CAPTURE_SOURCE: ${{ matrix.source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
        with:
          ref: a1c6bbe488284cf5f5b4ed7a8b1e30181e0f62ed
          path: released-0121
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
        with:
          ref: 1f73bde2b6ab5ab2324ce8079159004ee2713d3a
          path: released-0131
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: false
          python-version: "3.13"
      - name: Same locked dependencies and explicit Qt runtime
        timeout-minutes: 3
        shell: pwsh
        run: |
          uv sync --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip install --python .venv "pyside6-essentials==$env:QT_VERSION" "shiboken6==$env:QT_VERSION"
          exit $LASTEXITCODE
      - name: Fixed same-fixture observations with first failures retained
        id: observations
        timeout-minutes: 6
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:QUALIFICATION_HEAD) { throw 'Candidate source mismatch' }
          $dirty = git status --porcelain --untracked-files=no
          if ($LASTEXITCODE -ne 0 -or $dirty) { throw 'Tracked harness source is dirty' }
          $sourceRoot = $PWD.Path
          $sourceCommit = $env:QUALIFICATION_HEAD
          if ($env:CAPTURE_SOURCE -eq 'released-0121') {
            $sourceRoot = Join-Path $PWD 'released-0121'
            $sourceCommit = 'a1c6bbe488284cf5f5b4ed7a8b1e30181e0f62ed'
          } elseif ($env:CAPTURE_SOURCE -eq 'released-0131') {
            $sourceRoot = Join-Path $PWD 'released-0131'
            $sourceCommit = '1f73bde2b6ab5ab2324ce8079159004ee2713d3a'
          }
          $env:SOURCE_ROOT = $sourceRoot
          $env:SOURCE_COMMIT = $sourceCommit
          $env:PYTHONPATH = "$sourceRoot/src;$PWD"
          $python = Join-Path $PWD '.venv/Scripts/python.exe'
          New-Item -ItemType Directory -Force -Path receipts | Out-Null
          $failures = @()
          $scenarios = @('owned-drag', 'foreign-drag', 'foreign-hmenu', 'owned-escape', 'foreign-escape', 'tray-command', 'owned-window', 'owned-fullscreen', 'owned-repeat', 'owned-error')
          foreach ($scenario in $scenarios) {
            $env:QUALIFICATION_RUN_NONCE = [guid]::NewGuid().ToString('N')
            $env:QUALIFICATION_INPUT_LEDGER = Join-Path $PWD "receipts/$scenario.input.json"
            $log = Join-Path $PWD "receipts/$scenario.log"
            $errorLog = Join-Path $PWD "receipts/$scenario.stderr.log"
            $process = Start-Process -FilePath $python -ArgumentList @('-m', 'scripts.frozen_menu_native', $scenario) -NoNewWindow -PassThru -RedirectStandardOutput $log -RedirectStandardError $errorLog
            $timedOut = -not $process.WaitForExit(30000)
            if ($timedOut) {
              $process.Kill($true)
              $process.WaitForExit()
              Add-Content -LiteralPath $log -Value 'OUTER_PROCESS_DEADLINE: 30 seconds; first attempt retained'
            }
            if ($timedOut -or $process.ExitCode -ne 0) { $failures += $scenario }
            $cleanupLog = Join-Path $PWD "receipts/$scenario.cleanup.log"
            $cleanupError = Join-Path $PWD "receipts/$scenario.cleanup.stderr.log"
            $cleanup = Start-Process -FilePath $python -ArgumentList @('-m', 'scripts.frozen_menu_input', '--release-ledger', $env:QUALIFICATION_INPUT_LEDGER, $env:QUALIFICATION_RUN_NONCE, $process.Id) -NoNewWindow -PassThru -RedirectStandardOutput $cleanupLog -RedirectStandardError $cleanupError
            if (-not $cleanup.WaitForExit(10000)) {
              $cleanup.Kill($true)
              $cleanup.WaitForExit()
              Add-Content -LiteralPath $cleanupLog -Value "NATIVE_INPUT_CLEANUP=FAILED: cleanup process exceeded 10 seconds"
              throw "Timeout input cleanup hung; no subsequent cases will receive input"
            }
            if ($cleanup.ExitCode -ne 0) {
              Add-Content -LiteralPath $cleanupLog -Value "NATIVE_INPUT_CLEANUP=FAILED: cleanup process exit $($cleanup.ExitCode)"
              throw "Timeout input cleanup failed; no subsequent cases will receive input"
            }
            Get-Content -LiteralPath $log
            Get-Content -LiteralPath $errorLog
          }
          'input_cleanup_confirmed=true' >> $env:GITHUB_OUTPUT
          if ($failures.Count -gt 0) { throw "Native observations failed: $($failures -join ', ')" }
      - name: Existing candidate native popup, modal and tab focus contracts
        if: ${{ !cancelled() && matrix.source == 'candidate' && steps.observations.outputs.input_cleanup_confirmed == 'true' }}
        timeout-minutes: 3
        shell: pwsh
        run: |
          uv run --no-sync pytest tests/capture/test_capture_native.py tests/capture/test_tabs_baseline_native.py --require-interactive-capture --no-cov -p no:randomly -vv -rP
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: frozen-menu-${{ matrix.source }}-qt-${{ matrix.qt }}
          path: receipts/*.log
          if-no-files-found: error
          retention-days: 14
