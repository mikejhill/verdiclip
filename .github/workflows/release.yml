name: Release

# Every push to main updates a release pull request (version bump + CHANGELOG)
# computed from Conventional Commits. Merging that pull request tags the
# release, then the package is built once, verified, attested, and published
# to PyPI through trusted publishing (no API tokens).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      testpypi:
        description: Build the current main and publish it to TestPyPI only
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Version and changelog
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # GitHub holds pull_request runs on bot-opened PRs for approval, and the
      # required "CI passed" check only counts runs from the PR itself.
      # Approve those runs; if none appear, dispatch CI on the branch instead.
      - name: Run CI on the release pull request
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          branch=$(jq -r '.headBranchName' <<< "$PR_JSON")
          for attempt in $(seq 1 18); do
            ids=$(gh run list --repo "$GITHUB_REPOSITORY" --branch "$branch"               --event pull_request --status action_required               --json databaseId --jq '.[].databaseId')
            if [ -n "$ids" ]; then
              approved=true
              for id in $ids; do
                if gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve"; then
                  echo "Approved run $id"
                else
                  approved=false
                fi
              done
              if [ "$approved" = true ]; then exit 0; fi
              break
            fi
            echo "Waiting for pull request runs (attempt $attempt)"
            sleep 10
          done
          echo "Could not approve pull request runs; dispatching CI on $branch"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"

  ci:
    name: CI
    needs: release-please
    if: always() && (needs.release-please.outputs.release_created == 'true' || inputs.testpypi)
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] -- portable local reuse
    permissions:
      contents: read
      security-events: write
      pull-requests: write

  build:
    name: Build distributions
    needs: [release-please, ci]
    if: >-
      always() && needs.ci.result == 'success' &&
      (needs.release-please.outputs.release_created == 'true' || inputs.testpypi)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag_name || github.sha }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Build sdist and wheel
        run: uv build
      - name: Check package metadata
        run: uvx twine check --strict dist/*
      - name: Version must match the release tag
        if: needs.release-please.outputs.tag_name != ''
        shell: pwsh
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          $wheel = (Get-ChildItem dist/*.whl).Name
          $version = $env:TAG.TrimStart('v')
          if ($wheel -notlike "verdiclip-$version-*") { throw "Wheel $wheel does not match tag $env:TAG" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: [release-please, build]
    if: always() && needs.build.result == 'success' && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/verdiclip/
    permissions:
      id-token: write
      attestations: write
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish (trusted publishing, PEP 740 attestations)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      - name: Attach distributions to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: always() && needs.build.result == 'success' && inputs.testpypi
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/verdiclip/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
