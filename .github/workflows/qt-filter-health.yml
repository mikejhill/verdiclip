name: Isolated Qt filter health diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnostic:
    if: >-
      github.repository == 'mikejhill/verdiclip' &&
      github.event.pull_request.head.repo.full_name == 'mikejhill/verdiclip' &&
      github.head_ref == 'diagnostic/qt-filter-health' &&
      github.event.pull_request.draft == true
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      UV_LOCKED: '1'
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: '3.14'
          enable-cache: false
      - run: uv sync --locked
      - name: Record exact source and runtime
        shell: pwsh
        run: |
          git rev-parse HEAD
          uv run python -c "import sys; from PySide6.QtCore import qVersion; print(sys.version); print('Qt', qVersion()); assert qVersion() == '6.11.2'"
      - name: Diagnostic noninterference controls (separate process)
        run: uv run pytest scripts/diagnostic_tests/test_qt_filter_health.py --no-cov
      - name: Original full-suite gate with opt-in boundary probe
        timeout-minutes: 10
        shell: pwsh
        run: |
          uv run pytest --cov --cov-report=xml --cov-report=term `
            -o faulthandler_timeout=45 -m "not native_desktop" `
            --junitxml=junit.xml --ux-snapshots=docs/ux/snapshots `
            --randomly-seed=2613928143 -p scripts.qt_filter_health 2>&1 |
            Tee-Object -FilePath qt-filter-health.log
          exit $LASTEXITCODE
      - name: Preserve diagnostic evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qt-filter-health-py314-seed2613928143
          path: |
            qt-filter-health.log
            junit.xml
            coverage.xml
          if-no-files-found: warn
