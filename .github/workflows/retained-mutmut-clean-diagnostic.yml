name: Retained mutmut clean-test diagnosis
on:
  pull_request:
    # Two-source fresh statistics/clean comparison; never executes mutants.
    types: [opened, reopened, synchronize]
    paths:
      - scripts/retained_mutmut_clean_diagnostic.py
      - scripts/retained_mutmut_clean_source.json
      - tests/tooling/test_retained_mutmut_clean_diagnostic.py
      - .github/workflows/retained-mutmut-clean-diagnostic.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        source:
          - 5fe14b25b651c02caea31786e44e9508595e4e19
          - 92c8d0cd4e1f5114a4ddf210b30bbf4e5c40f510
    env:
      UV_LOCKED: "1"
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      RETAINED_SOURCE_SHA: ${{ matrix.source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.source }}
          path: retained
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: false
      - name: Same trusted Qt system libraries
        timeout-minutes: 2
        run: >-
          sudo apt-get update -qq &&
          sudo apt-get install -y -qq --no-install-recommends
          libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - name: Retained locked mutation environment
        working-directory: retained
        timeout-minutes: 1
        run: uv sync --locked --group mutation
      - name: Bounded statistics and clean tests only (never a mutation score)
        working-directory: retained
        timeout-minutes: 3
        shell: bash
        run: |
          set -o pipefail
          echo "Control source: $(git -C ../control rev-parse HEAD)"
          sha256sum ../control/scripts/retained_mutmut_clean_diagnostic.py \
            ../control/scripts/retained_mutmut_clean_source.json
          set +e
          timeout --signal=TERM --kill-after=5s 120s \
            uv run --no-sync --group mutation python -u -I \
            ../control/scripts/retained_mutmut_clean_diagnostic.py \
            --source-root "$PWD" --source-sha "$RETAINED_SOURCE_SHA"
          code=$?
          set -e
          echo "diagnostic_exit=$code; timeout124_or137_is_incomplete; exit0_is_clean_only; no_mutation_score"
          exit "$code"
