name: Mutation alerts

on:
  workflow_run:
    workflows: [Mutation testing]
    types: [completed]

permissions: {}

concurrency:
  group: mutation-alert-publisher
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event.workflow_run.event)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      # Execute trusted default-branch publisher code, never the triggering head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Retrieve data-only result for this attempt
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mutation-results-${{ github.event.workflow_run.run_attempt }}
          path: mutation-evidence
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Reconcile durable trackers
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            await require('./.github/scripts/mutation_alerts.cjs').publish({github, context, core});
