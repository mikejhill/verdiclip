name: Owned observation bounded research

# This workflow is separate from PR 119 and does not qualify the unresolved Qt CI failure.
on:
  push:
    branches: [research/held-credit-parent-death]

permissions:
  contents: read

jobs:
  installed-observe:
    if: >-
      github.repository == 'mikejhill/verdiclip' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/research/held-credit-parent-death'
    name: Research only / held-credit parent-death containment
    runs-on: windows-2025
    timeout-minutes: 7
    env:
      PYTHONUTF8: "1"
      QUALIFICATION_HEAD: "2d0cb4be43a51dbee038f2d65f7347ba5bb19231"
      QUALIFICATION_TREE: "fd934595b829e7d148a56cdd896cc0d2cb423e96"
      WORKFLOW_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
        with:
          ref: 2d0cb4be43a51dbee038f2d65f7347ba5bb19231
          persist-credentials: false
      - name: Assert fixed source and retain separate workflow identity
        timeout-minutes: 1
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          $tree = (git rev-parse 'HEAD^{tree}').Trim()
          if ($head -ne $env:QUALIFICATION_HEAD) { throw 'Wrong candidate head' }
          if ($tree -ne $env:QUALIFICATION_TREE) { throw 'Wrong candidate tree' }
          if ($env:WORKFLOW_HEAD -eq $head) { throw 'Expected a separate workflow-only commit' }
          New-Item -ItemType Directory -Force receipts | Out-Null
          [ordered]@{
            schema = 1
            scope = 'expected parent-death containment, not successful capture; no release or ordinary CI qualification'
            candidate_sha = $head
            candidate_tree = $tree
            workflow_sha = $env:WORKFLOW_HEAD
            workflow_ref = $env:GITHUB_WORKFLOW_REF
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
          } | ConvertTo-Json | Set-Content -Encoding utf8 receipts/research-source.json
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: false
          python-version: "3.13"
      - name: Locked dependencies and owned observe-only fixture
        timeout-minutes: 2
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:QUALIFICATION_HEAD) { throw 'Wrong candidate head' }
          uv sync --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build scripts/panel_fixture/PanelFixture.csproj --configuration Release --output .tmp/observe-fixture
          exit $LASTEXITCODE
      - name: Fresh-wheel fixed parent-death proof, no retries
        timeout-minutes: 3
        shell: pwsh
        run: |
          uv build --wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheels = @(Get-ChildItem dist -Filter *.whl)
          if ($wheels.Count -ne 1) { throw 'Expected exactly one candidate wheel' }
          $wheel = $wheels[0].FullName
          $proof = Join-Path $env:RUNNER_TEMP ('observe-proof-' + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $proof | Out-Null
          uv venv "$proof\venv"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $proof 'venv\Scripts\python.exe'
          uv pip install --python $python --no-deps $wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file "$proof\requirements.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip install --python $python --require-hashes -r "$proof\requirements.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item scripts/installed_runtime_smoke.py "$proof\installed_runtime_smoke.py"
          Copy-Item scripts/installed_channel_smoke.py "$proof\installed_channel_smoke.py"
          Copy-Item scripts/installed_observe_smoke.py "$proof\installed_observe_smoke.py"
          Copy-Item scripts/observe_process_diagnostics.py "$proof\observe_process_diagnostics.py"
          Copy-Item scripts/observe_credit_cancel.py "$proof\observe_credit_cancel.py"
          Copy-Item scripts/observe_death_control.py "$proof\observe_death_control.py"
          Copy-Item scripts/observe_death_witness.py "$proof\observe_death_witness.py"
          Copy-Item .tmp/observe-fixture "$proof\fixture" -Recurse
          $outside = New-Item -ItemType Directory -Path "$proof\outside checkout"
          # Zero exit proves this expected death outcome, never a successful capture.
          $caseOutput = Join-Path $proof 'receipts-parent-death-first'
          $target = Join-Path $env:GITHUB_WORKSPACE 'receipts/parent-death-first'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $target) | Out-Null
          $proofExit = 1
          Push-Location $outside.FullName
          try {
            & $python "$proof\installed_observe_smoke.py" --case parent-death-first --wheel $wheel --fixture "$proof\fixture\PanelFixture.exe" --output $caseOutput
            $proofExit = $LASTEXITCODE
          } finally {
            Pop-Location
            if (Test-Path $caseOutput) { Copy-Item $caseOutput $target -Recurse }
          }
          exit $proofExit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: research-installed-wheel-held-credit-parent-death
          path: |
            receipts/research-source.json
            scripts/installed_observe_smoke.py
            scripts/observe_process_diagnostics.py
            scripts/observe_credit_cancel.py
            scripts/observe_death_control.py
            scripts/observe_death_witness.py
            scripts/installed_channel_smoke.py
            scripts/installed_runtime_smoke.py
            scripts/panel_fixture/Program.cs
            src/verdiclip/capture/retained_frame.py
            src/verdiclip/capture/frame_credit.py
            src/verdiclip/platform/helper_channel.py
            src/verdiclip/platform/helper_peer.py
            src/verdiclip/platform/helper_protocol.py
            src/verdiclip/platform/helper_runtime.py
            src/verdiclip/platform/helper_bootstrap.py
            receipts/parent-death-first/receipt.json
            receipts/parent-death-first/membership-failure.json
            receipts/parent-death-first/failure-phase-evidence.json
            receipts/parent-death-first/startup-diagnostics/*.json
            receipts/parent-death-first/startup-diagnostics/*.jsonl
            receipts/parent-death-first/executor/*.json
            receipts/parent-death-first/executor/*.jsonl
            receipts/parent-death-first/executor/*.png
            receipts/parent-death-first/states/*.json
            receipts/parent-death-first/states/diagnostics/*.json
            receipts/parent-death-first/death-witness/death-ready.json
            receipts/parent-death-first/death-witness/death-begin.json
            receipts/parent-death-first/death-witness/death-pinned.json
            receipts/parent-death-first/death-witness/death-kill-request.json
            receipts/parent-death-first/death-witness/death-result.json
            receipts/parent-death-first/death-witness/death-calls.jsonl
            receipts/parent-death-first/death-witness/before-root.rgb
            receipts/parent-death-first/death-witness/after-death-??.json
            receipts/parent-death-first/death-witness/after-death-root.png
          if-no-files-found: error
          retention-days: 14
