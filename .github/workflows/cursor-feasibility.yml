name: Isolated cursor presentation feasibility

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnostic:
    if: >-
      github.repository == 'mikejhill/verdiclip' &&
      github.event.pull_request.head.repo.full_name == 'mikejhill/verdiclip' &&
      github.head_ref == 'diagnostic/cursor-feasibility' &&
      github.event.pull_request.draft == true
    runs-on: windows-2025
    timeout-minutes: 8
    env:
      UV_LOCKED: '1'
      PYTHONUTF8: '1'
      VERDICLIP_CURSOR_FEASIBILITY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          python-version: '3.13'
          enable-cache: false
      - run: uv sync --locked
      - name: Portable supervisor controls
        run: uv run pytest scripts/diagnostic_tests/test_cursor_feasibility.py --no-cov
      - name: Build reviewed Windows SDK oracle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .test-tmp/cursor-feasibility | Out-Null
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vcvars = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC/Auxiliary/Build/vcvars64.bat'
          if (-not $vcvars) { throw 'Official Windows SDK toolchain unavailable' }
          & cmd /d /c "`"$vcvars`" && cl /nologo /std:c++17 /EHsc /W4 tests\capture\cursor_oracle.cpp /Fe:.test-tmp\cursor-feasibility\cursor-oracle.exe /Fo:.test-tmp\cursor-feasibility\cursor-oracle.obj /link d3d11.lib dxgi.lib user32.lib gdi32.lib"
          if ($LASTEXITCODE -ne 0) { throw 'Oracle build failed' }
      - name: One bounded feasibility experiment, independent of UIA
        timeout-minutes: 3
        run: uv run python -m scripts.cursor_feasibility
      - name: Retain fixed metadata receipt only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cursor-feasibility-metadata
          path: .test-tmp/cursor-feasibility/receipt.json
          if-no-files-found: warn
