name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: "1"
  UV_LOCKED: "1"
  PYTHONUTF8: "1"

jobs:
  lint:
    name: Format and lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync
      - name: Check formatting
        run: uv run ruff format --check --diff .
      - name: Lint
        run: uv run ruff check --output-format=github .

  typecheck:
    name: Type check (ty, every rule at error)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ty check --output-format github

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Diff coverage compares against the base branch
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync
      - name: Unit, widget, platform, and UX journey tests
        run: >-
          uv run pytest --cov --cov-report=xml --cov-report=term
          -m "not native_desktop"
          --junitxml=junit.xml
          --ux-snapshots=docs/ux/snapshots
      - name: Coverage summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path coverage.xml) {
            $rate = ([xml](Get-Content coverage.xml)).coverage.'branch-rate'
            $lines = ([xml](Get-Content coverage.xml)).coverage.'line-rate'
            "### Coverage (Python ${{ matrix.python }})`n" +
            "| Lines | Branches |`n|---|---|`n" +
            ("| {0:P1} | {1:P1} |" -f [double]$lines, [double]$rate) >> $env:GITHUB_STEP_SUMMARY
          }
      - name: Diff coverage (lines this pull request changes)
        if: github.event_name == 'pull_request' && matrix.python == '3.13'
        shell: pwsh
        env:
          BASE: ${{ github.base_ref }}
        run: |
          uvx diff-cover@10.6.0 coverage.xml --compare-branch "origin/$env:BASE" `
            --fail-under 95 --markdown-report diff-coverage.md
          $status = $LASTEXITCODE
          if (Test-Path diff-coverage.md) {
            Get-Content diff-coverage.md >> $env:GITHUB_STEP_SUMMARY
          }
          exit $status
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-py${{ matrix.python }}
          path: |
            junit.xml
            coverage.xml
          if-no-files-found: ignore
      - name: Upload UX journey snapshots
        if: always() && matrix.python == '3.13'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ux-journey-snapshots
          path: docs/ux/snapshots
          if-no-files-found: ignore

  capture-contracts:
    name: Capture contracts (Qt ${{ matrix.qt }}, synthetic hardware)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        qt: ["6.11.2", "6.12.0"]
    env:
      QT_QPA_PLATFORM: offscreen
      QT_VERSION: ${{ matrix.qt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.13"
      - run: uv sync
      - name: Select explicit isolated compatibility profile
        run: >-
          uv pip install --python .venv
          "pyside6-essentials==$env:QT_VERSION" "shiboken6==$env:QT_VERSION"
      - name: Record environment and evidence boundary
        run: >-
          uv run --no-sync python -c
          "import sys, PySide6; from PySide6.QtCore import qVersion;
          print(sys.version); print('PySide6', PySide6.__version__, 'Qt', qVersion());
          print('Offscreen synthetic display/input/frame/provider contracts;
          no physical-device or native menu preservation claim')"
      - name: Capture, synthetic display topology and hotkey contracts
        run: >-
          uv run --no-sync pytest tests/capture tests/platform/test_hotkeys.py
          tests/shell/test_hotkey_field.py
          tests/shell/test_preview_manifest_contract.py
          -m "not native_desktop"
          --junitxml=capture-contracts.xml
      - name: Upload reproducible contract results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capture-contracts-qt${{ matrix.qt }}
          path: capture-contracts.xml
          if-no-files-found: ignore

  tabs-contracts:
    name: Simulated tabs (Qt ${{ matrix.qt }}, Python 3.13)
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        qt: ["6.11.2", "6.12.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Install locked test dependencies
        run: uv sync
      - name: Select the explicit supported Qt runtime without changing the lockfile
        env:
          QT_VERSION: ${{ matrix.qt }}
        run: uv pip install --python .venv "pyside6-essentials==$env:QT_VERSION" "shiboken6==$env:QT_VERSION"
      - name: Hardware-independent contracts and scoped branch coverage
        env:
          QT_VERSION: ${{ matrix.qt }}
        run: >-
          uv run --no-sync python scripts/test_tabs_ci.py
          --expected-python 3.13 --expected-qt "$env:QT_VERSION"
          --output-dir artifacts/tabs-ci
      - name: Upload simulated-contract evidence (never native qualification)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simulated-tabs-qt${{ matrix.qt }}
          path: |
            artifacts/tabs-ci/environment.json
            artifacts/tabs-ci/pytest.log
            artifacts/tabs-ci/junit.xml
            artifacts/tabs-ci/coverage.xml
            artifacts/tabs-ci/summary.md
          if-no-files-found: warn
      - name: Simulated contract summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path artifacts/tabs-ci/summary.md) {
            Get-Content artifacts/tabs-ci/summary.md >> $env:GITHUB_STEP_SUMMARY
          }

  ux-gallery:
    name: UX gallery (light and dark)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync
      - name: Render key screens in both themes
        run: uv run poe ux-gallery
      - name: Upload gallery for design review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ux-gallery
          path: docs/ux/gallery

  build:
    name: Build and verify distributions
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Build sdist and wheel
        run: uv build
      - name: Check package metadata
        run: uvx twine check --strict dist/*
      - name: Install the wheel in a clean environment and run it
        shell: pwsh
        run: |
          uv venv --python 3.13 .smoke
          $wheel = (Get-ChildItem dist/*.whl).FullName
          uv pip install --python .smoke $wheel
          & .smoke/Scripts/verdiclip.exe --version
          & .smoke/Scripts/python.exe -c "import verdiclip; assert verdiclip.VERSION != '0.0.0+unknown'"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Audit locked runtime and dev dependencies
        env:
          NO_COLOR: "1"
          FORCE_COLOR: ""
        run: |
          uv export --frozen --all-groups --no-emit-project --no-hashes --no-header             --output-file requirements-audit.txt
          uvx pip-audit --strict --no-deps --disable-pip --requirement requirements-audit.txt

  workflows:
    name: Workflow lint and security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4

  pr-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            docs
            test
            refactor
            build
            ci
            chore
            style
            revert
          requireScope: false

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure

  ci-passed:
    name: CI passed
    if: always()
    needs: [lint, typecheck, test, capture-contracts, tabs-contracts, ux-gallery, build, audit, workflows]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "A required job finished with: $result"
              exit 1
            fi
          done
