name: Bounded scrolling native qualification

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    if: >-
      github.repository == 'mikejhill/verdiclip' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == 'mikejhill/verdiclip' &&
        (((github.head_ref == 'feature/simple-scrolling' ||
           github.head_ref == 'diagnostics/scrolling-0140') && github.event.pull_request.draft == true) ||
         github.head_ref == 'release-please--branches--main--components--verdiclip')))
    name: Actual application / ${{ matrix.application }}
    runs-on: windows-2025
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        application: [edge, edge-nested, notepad, edge-cancel, edge-input, edge-covered,
          edge-select, edge-select-enter, edge-select-input, edge-select-focus,
          edge-app-tray, edge-app-hotkey, edge-app-escape]
    env:
      QT_QPA_PLATFORM: windows
      PYTHONUTF8: "1"
      SCROLL_APPLICATION: ${{ matrix.application }}
      QUALIFICATION_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require exact qualification source
        run: |
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:QUALIFICATION_HEAD) { throw 'Source mismatch' }
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - name: Prove the desktop can really be captured
        timeout-minutes: 2
        run: uv run pytest tests/capture/test_grabber.py::TestMssScreenSource::test_freeze --require-interactive-capture -v
      - name: Exercise the same helper against an installed application
        timeout-minutes: 2
        run: |
          if ($env:SCROLL_APPLICATION.StartsWith("edge-app")) {
            uv run python -m scripts.simple_scroll_app "$env:SCROLL_APPLICATION"
          } elseif ($env:SCROLL_APPLICATION.StartsWith("edge-select")) {
            uv run python -m scripts.simple_scroll_handoff "$env:SCROLL_APPLICATION"
          } else {
            uv run python -m scripts.simple_scroll_native "$env:SCROLL_APPLICATION"
          }
      - name: Existing native popup, capture and tab focus regressions
        if: matrix.application == 'edge-app-tray'
        timeout-minutes: 3
        run: >-
          uv run pytest tests/capture/test_capture_native.py
          tests/capture/test_tabs_baseline_native.py
          tests/ux/test_scrolling_failure_journeys.py::test_interruption_feedback_preserves_native_focus
          --require-interactive-capture --no-cov -p no:randomly -vv -rP
          --junitxml=artifacts/simple-scroll/ordinary-native.xml
          --basetemp=artifacts/simple-scroll/native-temp
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: simple-scroll-${{ matrix.application }}
          path: artifacts/simple-scroll
          if-no-files-found: warn
          retention-days: 14

  diagnostic:
    if: >-
      github.repository == 'mikejhill/verdiclip' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == 'mikejhill/verdiclip' &&
        (((github.head_ref == 'feature/simple-scrolling' ||
           github.head_ref == 'diagnostics/scrolling-0140' ||
           github.head_ref == 'diagnose/main-native-failures') && github.event.pull_request.draft == true) ||
         github.head_ref == 'release-please--branches--main--components--verdiclip')))
    name: Representative baseline / ${{ matrix.application }}
    runs-on: windows-2025
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        application: [edge-prose-click, edge-prose-enter, edge-panel-click,
          edge-panel-enter, edge-sidebar-enter, edge-background-click,
          edge-background-enter, explorer-click, explorer-enter,
          explorer-middle-click, explorer-middle-enter,
          explorer-bottom-click, explorer-bottom-enter]
    env:
      QT_QPA_PLATFORM: windows
      PYTHONUTF8: "1"
      SCROLL_APPLICATION: ${{ matrix.application }}
      QUALIFICATION_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require exact diagnostic source
        run: |
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:QUALIFICATION_HEAD) { throw 'Source mismatch' }
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - name: Prove real desktop capture
        timeout-minutes: 2
        run: uv run pytest tests/capture/test_grabber.py::TestMssScreenSource::test_freeze --require-interactive-capture -v
      - name: Record actual controller capture on ordinary layouts
        timeout-minutes: 2
        run: uv run python -m scripts.scrolling_diagnostics "$env:SCROLL_APPLICATION"
      - name: Require the existing 96-DPI no-horizontal-bar List path
        if: startsWith(matrix.application, 'explorer-')
        run: |
          uv run python -c "import json, os; from pathlib import Path; from scripts.scrolling_diagnostics import _no_hbar_target_layout; p = Path('artifacts/simple-scroll') / os.environ['SCROLL_APPLICATION']; assert json.loads((p / 'target.json').read_text())['window_dpi'] == 96; _no_hbar_target_layout(p, {})"
          if ($LASTEXITCODE -ne 0) { throw 'The baseline no-H List capability was not qualified' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: scrolling-diagnostic-${{ matrix.application }}
          path: artifacts/simple-scroll
          if-no-files-found: warn
          retention-days: 14

  display-setup:
    if: >-
      github.repository == 'mikejhill/verdiclip' &&
      ((github.event_name == 'workflow_dispatch') ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == 'mikejhill/verdiclip' &&
        (((github.head_ref == 'feature/simple-scrolling' ||
           github.head_ref == 'diagnostics/scrolling-0140') && github.event.pull_request.draft == true) ||
         github.head_ref == 'release-please--branches--main--components--verdiclip')))
    name: Actual 200% Edge controls
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: windows
      PYTHONUTF8: "1"
      QUALIFICATION_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Reject manual dispatch outside main before checkout
        if: github.event_name == 'workflow_dispatch'
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Manual scrolling diagnostics require main' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require exact setup source
        run: |
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:QUALIFICATION_HEAD) { throw 'Source mismatch' }
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - name: Probe supported display scaling in this disposable runner
        timeout-minutes: 2
        run: uv run python -m scripts.hosted_display_scale
      - name: Capture actual applications in this same verified display session
        timeout-minutes: 9
        run: |
          $cases = @('edge-prose-click', 'edge-prose-enter', 'edge-panel-click', 'edge-panel-enter',
            'edge-panel-focused-click', 'edge-panel-focused-enter')
          foreach ($case in $cases) {
            uv run python -c "import json; from dataclasses import asdict; from scripts.hosted_display_scale import Display; value = Display().read(); print(json.dumps(asdict(value))); assert value.qualified"
            if ($LASTEXITCODE -ne 0) { throw 'Display is not at verified 200% before capture' }
            uv run python -m scripts.scrolling_diagnostics "$case"
            if ($LASTEXITCODE -ne 0) { throw "Native 200% capture failed: $case" }
            $target = Get-Content -Raw "artifacts/simple-scroll/$case/target.json" | ConvertFrom-Json
            if ($target.window_dpi -ne 192) { throw "Target DPI is not 192: $case" }
            uv run python -c "import json; from dataclasses import asdict; from scripts.hosted_display_scale import Display; value = Display().read(); print(json.dumps(asdict(value))); assert value.qualified"
            if ($LASTEXITCODE -ne 0) { throw 'Display changed during capture' }
          }
      - name: Optional fully traced tiny Explorer stress
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        timeout-minutes: 8
        run: |
          foreach ($case in @('explorer-click', 'explorer-enter', 'explorer-middle-click',
            'explorer-middle-enter', 'explorer-bottom-click', 'explorer-bottom-enter')) {
            uv run python -c "from scripts.hosted_display_scale import Display; assert Display().read().qualifies(200)"
            if ($LASTEXITCODE -ne 0) { throw 'Display changed before optional stress' }
            uv run python -m scripts.scrolling_diagnostics "$case"
            if ($LASTEXITCODE -ne 0) { throw "Optional traced tiny capture failed: $case" }
            $target = Get-Content -Raw "artifacts/simple-scroll/$case/target.json" | ConvertFrom-Json
            if ($target.window_dpi -ne 192) { throw 'Stress target DPI is not 192' }
            uv run python -c "from scripts.hosted_display_scale import Display; assert Display().read().qualifies(200)"
            if ($LASTEXITCODE -ne 0) { throw 'Display changed during optional stress' }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: scrolling-display-setup-200
          path: artifacts/simple-scroll
          if-no-files-found: warn
          retention-days: 14

  representative-layout:
    if: >-
      github.repository == 'mikejhill/verdiclip' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == 'mikejhill/verdiclip' &&
        (((github.head_ref == 'feature/simple-scrolling' ||
           github.head_ref == 'diagnostics/scrolling-0140') && github.event.pull_request.draft == true) ||
         github.head_ref == 'release-please--branches--main--components--verdiclip')))
    name: Representative layout / ${{ matrix.scale }}% / ${{ matrix.application }}${{ matrix.layout == 'no-hbar' && ' / no-hbar' || '' }}
    runs-on: windows-2025
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        scale: [125, 200]
        layout: [taller]
        application: [explorer-click, explorer-enter,
          explorer-middle-click, explorer-middle-enter,
          explorer-bottom-click, explorer-bottom-enter]
        include:
          - {scale: 125, application: explorer-click, layout: no-hbar}
          - {scale: 125, application: explorer-enter, layout: no-hbar}
          - {scale: 125, application: explorer-middle-click, layout: no-hbar}
          - {scale: 125, application: explorer-middle-enter, layout: no-hbar}
          - {scale: 125, application: explorer-bottom-click, layout: no-hbar}
          - {scale: 125, application: explorer-bottom-enter, layout: no-hbar}
          - {scale: 200, application: explorer-click, layout: no-hbar}
          - {scale: 200, application: explorer-enter, layout: no-hbar}
          - {scale: 200, application: explorer-middle-click, layout: no-hbar}
          - {scale: 200, application: explorer-middle-enter, layout: no-hbar}
          - {scale: 200, application: explorer-bottom-click, layout: no-hbar}
          - {scale: 200, application: explorer-bottom-enter, layout: no-hbar}
          - {scale: 125, application: edge-prose-click}
          - {scale: 125, application: edge-prose-enter}
          - {scale: 125, application: edge-panel-click}
          - {scale: 125, application: edge-panel-enter}
          - {scale: 125, application: edge-panel-focused-click}
          - {scale: 125, application: edge-panel-focused-enter}
    env:
      QT_QPA_PLATFORM: windows
      PYTHONUTF8: "1"
      SCROLL_APPLICATION: ${{ matrix.application }}
      EXPLORER_LAYOUT: ${{ matrix.layout }}
      DISPLAY_SCALE: ${{ matrix.scale }}
      QUALIFICATION_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require exact representative source
        run: |
          $actual = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:QUALIFICATION_HEAD) { throw 'Source mismatch' }
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - name: Set the offered real display scale in this disposable runner
        id: setup
        timeout-minutes: 2
        run: uv run python -m scripts.hosted_display_scale --scale "$env:DISPLAY_SCALE"
      - name: Capture the existing owned representative fixture
        timeout-minutes: 2
        run: |
          uv run python -c "import os; from scripts.hosted_display_scale import Display; assert Display().read().qualifies(int(os.environ['DISPLAY_SCALE']))"
          if ($LASTEXITCODE -ne 0) { throw 'Display changed before representative capture' }
          if ($env:EXPLORER_LAYOUT -eq 'no-hbar') {
            uv run python -m scripts.scrolling_diagnostics "$env:SCROLL_APPLICATION" --no-hbar-explorer
          } elseif ($env:SCROLL_APPLICATION.StartsWith('explorer-')) {
            uv run python -m scripts.scrolling_diagnostics "$env:SCROLL_APPLICATION" --taller-explorer
          } else {
            uv run python -m scripts.scrolling_diagnostics "$env:SCROLL_APPLICATION"
          }
          if ($LASTEXITCODE -ne 0) { throw "Representative capture failed: $env:SCROLL_APPLICATION" }
      - name: Verify native target DPI and the same display after capture
        id: display-check
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        timeout-minutes: 1
        run: |
          $target = Get-Content -Raw "artifacts/simple-scroll/$env:SCROLL_APPLICATION/target.json" | ConvertFrom-Json
          $dpi = @{ '125' = 120; '200' = 192 }[$env:DISPLAY_SCALE]
          if ($target.window_dpi -ne $dpi) { throw 'Representative target DPI does not match the actual requested scale' }
          uv run python -c "import os; from scripts.hosted_display_scale import Display; assert Display().read().qualifies(int(os.environ['DISPLAY_SCALE']))"
          if ($LASTEXITCODE -ne 0) { throw 'Display changed during representative capture' }
      - name: Compare tiny ordinary helper with a fresh traced reference
        if: matrix.scale == 200 && matrix.application == 'explorer-click' && matrix.layout == 'taller'
        timeout-minutes: 3
        run: |
          uv run python -c "from scripts.hosted_display_scale import Display; assert Display().read().qualifies(200)"
          if ($LASTEXITCODE -ne 0) { throw 'Display changed before helper comparison' }
          uv run python -m scripts.scrolling_diagnostics explorer-helper-output
          if ($LASTEXITCODE -ne 0) { throw 'Fresh-reference ordinary helper comparison failed' }
          $result = Get-Content -Raw 'artifacts/simple-scroll/explorer-helper-output/result.json' | ConvertFrom-Json
          if ($result.success -ne $true -or $result.helper_output_passed -ne $true -or
              $result.product_capture_qualification -ne $false) {
            throw 'Missing separate helper-output receipt'
          }
          uv run python -c "from scripts.hosted_display_scale import Display; assert Display().read().qualifies(200)"
          if ($LASTEXITCODE -ne 0) { throw 'Display changed during helper comparison' }
      - name: Capture existing Edge table and nested panel at verified 125%
        if: >-
          ${{ !cancelled() && matrix.scale == 125 && matrix.application == 'edge-prose-click' &&
              steps.setup.outcome == 'success' && steps.display-check.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          $failures = @()
          foreach ($case in @('edge', 'edge-nested')) {
            uv run python -c "import os; from scripts.hosted_display_scale import Display; assert Display().read().qualifies(int(os.environ['DISPLAY_SCALE']))"
            if ($LASTEXITCODE -ne 0) { throw 'Display changed before representative capture' }
            uv run python -m scripts.simple_scroll_native "$case"
            if ($LASTEXITCODE -ne 0) { $failures += $case }
            uv run python -c "import os; from scripts.hosted_display_scale import Display; assert Display().read().qualifies(int(os.environ['DISPLAY_SCALE']))"
            if ($LASTEXITCODE -ne 0) { throw 'Display changed during representative capture' }
          }
          if ($failures.Count -ne 0) { throw "Native 125% capture failed: $($failures -join ', ')" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: scrolling-representative-${{ matrix.scale }}-${{ matrix.application }}${{ matrix.layout == 'no-hbar' && '-no-hbar' || '' }}
          path: artifacts/simple-scroll
          if-no-files-found: warn
          retention-days: 14
