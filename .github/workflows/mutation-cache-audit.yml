name: Mutation cache audit

on:
  pull_request:
    paths:
      - '.github/workflows/mutation-cache-audit.yml'
      - 'scripts/mutation_cache_audit.py'
      - 'tests/portable/test_mutation_cache_audit.py'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    cache-mode: read
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          python-version: '3.13.18'
      - name: Restore exact retained snapshot, never execute it
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mutants
          key: mutmut-v5-Linux-X64-e271dd86112a839b778d00595f437e8600257e99-8cd75773561a1831089baf80495409350e70d4e35ffaecf6873e11213ae0e40a-41969126494-${{ matrix.attempt }}
          fail-on-cache-miss: true
      - name: Require exact cache hit
        env:
          EXACT_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: test "$EXACT_HIT" = 'true'
      - name: Inspect only data and ASTs from the exact cache
        run: |
          uv run --no-project --python 3.13.18 python -c 'import sys; assert sys.version_info[:3] == (3, 13, 18), sys.version'
          uv run --no-project --python 3.13.18 python -m scripts.mutation_cache_audit mutants mutation-cache-audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-cache-audit-${{ matrix.attempt }}
          path: mutation-cache-audit.json
          if-no-files-found: error
