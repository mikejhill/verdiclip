name: Owned focus fixture qualification

on:
  pull_request:
    paths:
      - tests/ux/test_app_journeys.py
      - tests/ux/test_app_fixture_lifecycle.py
      - .github/workflows/focus-fixture-lifecycle.yml

permissions:
  contents: read

jobs:
  qualify:
    name: Linux offscreen / Qt ${{ matrix.qt }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        qt: ["6.11.2", "6.12.0"]
    env:
      UV_LOCKED: "1"
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      QT_VERSION: ${{ matrix.qt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          enable-cache: false
          python-version: "3.13"
      - name: Install the same Qt system libraries
        timeout-minutes: 2
        run: >-
          sudo apt-get update -qq &&
          sudo apt-get install -y -qq --no-install-recommends
          libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - name: Locked dependencies and exact supported Qt profile
        timeout-minutes: 2
        run: |
          uv sync --locked
          uv pip install --python .venv "pyside6-essentials==$QT_VERSION" "shiboken6==$QT_VERSION"
          uv run --no-sync python -c "from PySide6.QtCore import qVersion; print('Qt', qVersion(), flush=True)"
      - name: Retained fixture must fail the new disposal regression
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          saved="$RUNNER_TEMP/reviewed-fixture.py"
          cp tests/ux/test_app_journeys.py "$saved"
          trap 'cp "$saved" tests/ux/test_app_journeys.py' EXIT
          git show 5fe14b25b651c02caea31786e44e9508595e4e19:tests/ux/test_app_journeys.py > tests/ux/test_app_journeys.py
          sha256sum tests/ux/test_app_journeys.py
          set +e
          timeout --signal=TERM --kill-after=5s 60s uv run --no-sync pytest \
            tests/ux/test_app_fixture_lifecycle.py --no-cov -p no:randomly \
            --junitxml=fixture-before.xml -q > fixture-before.log 2>&1
          code=$?
          set -e
          cat fixture-before.log
          uv run --no-sync python -c 'import sys, xml.etree.ElementTree as E; r=E.parse("fixture-before.xml").getroot(); t=list(r.iter("testcase")); assert sys.argv[1]=="1" and len(t)==1 and not list(r.iter("error")); f=t[0].find("failure"); assert f is not None and "Fixture teardown returned before status destruction" in (f.text or "")' "$code"
      - name: Owned disposal and original capture journey after correction
        timeout-minutes: 2
        run: >-
          timeout --signal=TERM --kill-after=5s 90s uv run --no-sync pytest --no-cov -p no:randomly -vv
          tests/ux/test_app_fixture_lifecycle.py
          tests/ux/test_app_journeys.py::TestUpdates::test_numeric_checkout_checks_the_stable_release
          tests/ux/test_capture_journeys.py::TestRegionCapture::test_click_finishes_a_selection_started_with_enter
          tests/capture/test_popup_capture.py::test_application_deactivation_cancels_selection
          tests/capture/test_popup_capture.py::test_losing_input_cancels_and_next_capture_recovers
