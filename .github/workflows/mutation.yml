name: Mutation testing

# Asynchronous default-branch signal, independent of PR/release readiness.
# Pushes resume verified candidates; weekly/manual runs are cold.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-default-branch
  cancel-in-progress: false

env:
  FORCE_COLOR: "1"
  UV_LOCKED: "1"
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: offscreen
  MUTATION_FLOOR: "72"

jobs:
  admit:
    name: Require default branch
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Reject non-default manual references
        env:
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: test "$REF" = "refs/heads/$DEFAULT_BRANCH"

  mutate:
    needs: admit
    name: Mutation score
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install Qt's system libraries
        run: >-
          sudo apt-get update -qq &&
          sudo apt-get install -y -qq --no-install-recommends
          libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - run: uv sync --group mutation
      - name: Qualify candidate identity with the actual locked CLI
        id: probe
        run: uv run --no-sync --group mutation python scripts/mutation_identity_probe.py
      - name: Choose compatible verdict cache
        id: cache_plan
        env:
          CACHE_FINGERPRINT: ${{ hashFiles('uv.lock', 'pyproject.toml', 'tests/**/*.py', '.github/workflows/mutation.yml', 'scripts/mutation_ci.py', 'scripts/mutation_identity.py', 'scripts/mutation_identity_probe.py', 'scripts/mutation-cache-compatibility.json', 'scripts/mutation_cache.py') }}
        run: |
          prefix=$(uv run --no-sync python scripts/mutation_cache.py prefix)
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
      - name: Restore earlier verdicts
        # The weekly run starts fresh, so its score never rests on a stale verdict
        if: github.event_name == 'push'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mutants
          # Verdicts only carry over between runs with the same dependencies and setup
          key: ${{ steps.cache_plan.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.cache_plan.outputs.prefix }}
      - name: Verify portable baseline before mutation
        id: baseline
        # Fail a stalled baseline while preserving time for failure evidence.
        timeout-minutes: 10
        run: |
          set -o pipefail
          uv run pytest -m 'not native_desktop' -p no:randomly -q 2>&1 \
            | tee mutation-baseline.txt
      - name: Qualify restored verdict context
        id: cache_context
        run: uv run --no-sync python scripts/mutation_cache.py prepare
      - name: Prepare candidate identity guard
        id: prepare
        run: uv run --group mutation python scripts/mutation_identity.py prepare --max-children "$(nproc)"
      - name: Run mutmut
        id: mutate
        run: |
          # Reuse only verified identical candidate bodies.
          uv run --group mutation mutmut run --max-children "$(nproc)" > mutmut.log 2>&1 || {
            tail -n 200 mutmut.log
            exit 1
          }
          tail -n 3 mutmut.log
      - name: Verify candidate identities
        id: identity
        if: always() && steps.prepare.outcome == 'success'
        run: uv run --no-sync --group mutation python scripts/mutation_identity.py verify
      - name: Preserve available verdicts and completion status
        id: verdicts
        if: always()
        env:
          MUTATION_OUTCOME: ${{ steps.mutate.outcome == 'success' && steps.identity.outcome == 'success' && 'success' || 'failure' }}
          SOURCE_SHA: ${{ github.sha }}
          PATTERNS: ""
          IDENTITY_OUTCOME: ${{ steps.identity.outcome }}
        run: |
          uv run --no-sync python scripts/mutation_ci.py record > mutation-run-state.json
          if [ "$IDENTITY_OUTCOME" = 'success' ]; then
            uv run --no-sync --group mutation mutmut results --all true > mutation-results.txt
          fi
      - name: Seal qualified verdict context
        id: cache_seal
        if: always() && steps.identity.outcome == 'success'
        run: uv run --no-sync python scripts/mutation_cache.py seal
      - name: Save verdicts for later runs
        # Also after a failure or cancellation: mutmut records each verdict as
        # it goes, so the next run resumes instead of starting over
        if: always() && steps.cache_seal.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mutants
          key: ${{ steps.cache_plan.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
      - name: Report asynchronous score and findings
        if: always() && steps.mutate.outcome == 'success' && steps.identity.outcome == 'success' && steps.verdicts.outcome == 'success' && steps.cache_seal.outcome == 'success'
        run: |
          set -o pipefail
          uv run --group mutation python scripts/mutation_report.py mutation-results.txt \
            --fail-under "$MUTATION_FLOOR" --show-diffs 25 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Retain identity diagnostics
        if: always()
        run: |
          for name in receipt expected; do
            if [ -f ".test-tmp/mutation-identity/$name.json" ]; then
              cp -- ".test-tmp/mutation-identity/$name.json" "mutation-identity-$name.json"
            fi
          done
      - name: Retain verdict context qualification
        if: always()
        run: |
          if [ -f .test-tmp/mutation-cache-context.json ]; then
            cp -- .test-tmp/mutation-cache-context.json mutation-cache-context.json
          fi
      - name: Emit structured completion evidence
        if: always()
        env:
          CACHE_CONTEXT_OUTCOME: ${{ steps.cache_context.outcome == 'success' && steps.cache_seal.outcome == 'success' && 'success' || 'failure' }}
          BASELINE_OUTCOME: ${{ steps.baseline.outcome }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          MUTATION_OUTCOME: ${{ steps.mutate.outcome }}
          IDENTITY_OUTCOME: ${{ steps.identity.outcome }}
        run: uv run --no-sync python -m scripts.mutation_result
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-results-${{ github.run_attempt }}
          path: |
            mutation-cache-context.json
            mutation-result.json
            mutation-results.txt
            mutmut.log
            mutation-baseline.txt
            mutation-run-state.json
            mutation-identity-probe.json
            mutation-identity-probe-*.log
            mutation-identity-receipt.json
            mutation-identity-expected.json
          if-no-files-found: ignore
